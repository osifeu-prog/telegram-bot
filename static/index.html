<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLH Investor Wallet</title>
<style>
body { font-family: system-ui; background: #0f172a; color: #e2e8f0; padding: 1rem; }
.card { background: #1e293b; border-radius: 1rem; padding: 1rem; margin: 1rem 0; }
.leaderboard li { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
.coins { color: #fbbf24; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
  <h2>🏆 Top 10</h2>
  <ul class="leaderboard" id="top-list">Loading...</ul>
</div>
<script>
async function loadTop() {
  try {
    const resp = await fetch('/api/top?limit=10');
    const data = await resp.json();
    const list = document.getElementById('top-list');
    if (!data.length) { list.innerHTML = '<li>No participants yet.</li>'; return; }
    list.innerHTML = data.map(u =>
      `<li><span>#${u.rank} <strong>${u.telegram_id}</strong></span> <span class="coins">${u.coins} 💰</span></li>`
    ).join('');
  } catch(e) { document.getElementById('top-list').innerHTML = '<li>Error loading leaderboard</li>'; }
}
loadTop();
setInterval(loadTop, 30000);
</script>
</body>
</html>
