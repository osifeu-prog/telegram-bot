<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLH Investor Wallet</title>
<style>
body { font-family: system-ui; background: #0f172a; color: #e2e8f0; padding: 1rem; }
.card { background: #1e293b; border-radius: 1rem; padding: 1rem; margin: 1rem 0; }
.btn { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 0.5rem; border: none; font-weight: bold; cursor: pointer; margin: 0.5rem; }
.btn-primary { background: #3b82f6; color: white; }
.btn-success { background: #10b981; color: white; }
.leaderboard li { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #334155; }
.coins { color: #fbbf24; font-weight: bold; }
.hidden { display: none; }
</style>
</head>
<body>
<!-- ×ž×¡×š Onboarding -->
<div id="onboarding" class="card">
  <h2>ðŸš€ Welcome to SLH Investor Wallet!</h2>
  <p>Earn daily rewards, vote on community decisions, and unlock exclusive features.</p>
  <p>Choose your path:</p>
  <button class="btn btn-primary" onclick="choosePath('gaming')">ðŸŽ® Gaming  Daily tasks & rewards</button>
  <button class="btn btn-success" onclick="choosePath('community')">ðŸ›ï¸ Community  Voting & governance</button>
</div>

<!-- ×ž×¡×š ×œ×™×“×¨×‘×•×¨×“ (×ž×•×¡×ª×¨ ×¢×“ ××—×¨×™ Onboarding) -->
<div class="card hidden" id="voting-section">
  <h2>🗳 Active Votes</h2>
  <div id="votes-list">Loading votes...</div>
</div>
<script>
async function loadVotes() {
  try {
    const resp = await fetch('/api/votes');
    const votes = await resp.json();
    const container = document.getElementById('votes-list');
    if (!votes.length) { container.innerHTML = '<p>No active votes</p>'; return; }
    container.innerHTML = votes.map(v => {
      const opts = v.options.map((o,i) => `<button onclick="castVote(${v.id},${i})" class="btn btn-primary">${o}</button>`).join(' ');
      return `<div class="card"><strong>${v.question}</strong><div>${opts}</div></div>`;
    }).join('');
  } catch(e) { console.error(e); }
}
async function castVote(voteId, optionIndex) {
  await fetch(`/api/vote/${voteId}/${optionIndex}`, {method:'POST'});
  alert('Vote cast!');
  loadVotes();
}
// Call loadVotes when the main screen is shown
document.addEventListener('DOMContentLoaded', () => {
  if (!document.getElementById('onboarding').classList.contains('hidden')) return;
  document.getElementById('voting-section').classList.remove('hidden');
  loadVotes();
});
</script>
<div id="main" class="hidden">
  <div class="card">
    <h2>ðŸ† Top 10</h2>
    <ul class="leaderboard" id="top-list">Loading...</ul>
  </div>
</div>

<script>
// ×‘×“×•×§ ×× ×”×ž×©×ª×ž×© ×›×‘×¨ ×‘×—×¨ ×ž×¡×œ×•×œ (×©×ž×•×¨ ×‘-localStorage)
const savedPath = localStorage.getItem('slh_path');
if (savedPath) {
  document.getElementById('onboarding').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  loadTop();
}

async function choosePath(path) {
  // ×©×ž×™×¨×” ×ž×§×•×ž×™×ª + ×©×œ×™×—×” ×œ×©×¨×ª
  localStorage.setItem('slh_path', path);
  // ×©×œ×™×—×ª ×‘×—×™×¨×” ×œ×©×¨×ª (API ×¤×©×•×˜)
  try {
    await fetch('/api/set_path', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telegram_id: window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 8789977826, path: path })
    });
  } catch(e) { console.error(e); }
  // ×ž×ª×Ÿ ×¤×¨×¡ ×¨××©×•×Ÿ
  alert('ðŸŽ You received 50 Genesis Shards!');
  document.getElementById('onboarding').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  loadTop();
}

async function loadTop() {
  try {
    const resp = await fetch('/api/top?limit=10');
    const data = await resp.json();
    const list = document.getElementById('top-list');
    if (!data.length) { list.innerHTML = '<li>No participants yet.</li>'; return; }
    list.innerHTML = data.map(u =>
      `<li><span>#${u.rank} <strong>${u.telegram_id}</strong></span> <span class="coins">${u.coins} ðŸ’°</span></li>`
    ).join('');
  } catch(e) { document.getElementById('top-list').innerHTML = '<li>Error loading leaderboard</li>'; }
}
</script>
</body>
</html>
